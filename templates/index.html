<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; transition: background-color 0.25s ease, color 0.25s ease; }
    html.dark body { background-color: #0f172a; color: #ffffff; }
    html.dark .text-slate-900,
    html.dark .text-slate-800,
    html.dark .text-slate-700,
    html.dark .text-slate-600 { color: #ffffff !important; }
    html.dark .text-slate-500,
    html.dark .text-slate-400 { color: #e2e8f0 !important; }
    html.dark .bg-white { background-color: #1e293b !important; }
    html.dark .bg-slate-50 { background-color: #0f172a !important; }
    html.dark .bg-slate-100 { background-color: #334155 !important; }
    html.dark .border-slate-200,
    html.dark .border-slate-300,
    html.dark .border-slate-100 { border-color: #334155 !important; }
    html.dark input,
    html.dark textarea,
    html.dark select { background-color: #0f172a !important; color: #ffffff !important; border-color: #475569 !important; }
    .protected-content { user-select: none !important; -webkit-user-select: none !important; }
    .ed-container { width: 100%; margin-left: auto; margin-right: auto; }
    .ed-surface-card { transition: box-shadow 0.2s ease, border-radius 0.2s ease, background-color 0.2s ease; }
    @media print {
      body.lesson-protection-active * { display: none !important; }
      body.lesson-protection-active::after {
        content: "Печать и сохранение защищённых материалов курса запрещены системой безопасности.";
        display: block !important; font-size: 20px; font-weight: bold; padding: 40px; text-align: center;
      }
    }
  </style>
  <style id="educraft-design-vars"></style>
</head>

    let ui = {
      mode: 'storefront',
      view: 'catalog',
      category: 'Все курсы',
      search: '',
      courseId: null,
      lessonId: null,
      constructorTab: 'appearance',
      photoFilterPage: 'all',

      htmlFullscreen: false

    let designDraft = null;
    let newPhotoDraft = {
      imageUrl: '',
      storedName: '',
      title: '',
      caption: '',
      pageTarget: 'catalog',
      targetEntityId: '',
      placement: 'after_hero',
      align: 'center',

    function getActiveDesign() {
      const saved = serverState?.settings?.design || {};
      return { ...DEFAULT_DESIGN, ...saved };
    }

    function applyPageDesign(designObj) {
      const d = { ...DEFAULT_DESIGN, ...(designObj || {}) };
      const styleEl = document.getElementById('educraft-design-vars');
      if (!styleEl) return;

      const bodyFont = d.fontFamily === 'Playfair Display'
        ? "'Inter', sans-serif"
        : `'${d.fontFamily}', 'Inter', sans-serif`;
      const headingFont = d.fontFamily === 'Playfair Display'
        ? "'Playfair Display', Georgia, serif"
        : `'${d.fontFamily}', 'Inter', sans-serif`;

      const radiusMap = { sharp: '0.375rem', rounded: '1rem', pill: '1.5rem' };
      const btnRadiusMap = { sharp: '0.375rem', rounded: '0.75rem', pill: '9999px' };
      const shadowMap = {
        none: 'none',
        soft: '0 2px 12px rgba(15, 23, 42, 0.06)',
        elevated: '0 14px 32px rgba(15, 23, 42, 0.13)'
      };
      const containerMap = { narrow: '960px', normal: '1280px', wide: '1440px' };

      const cardRadius = radiusMap[d.borderRadius] || radiusMap.rounded;
      const btnRadius = btnRadiusMap[d.borderRadius] || btnRadiusMap.rounded;
      const cardShadow = shadowMap[d.cardShadow] || shadowMap.soft;
      const containerMax = containerMap[d.containerWidth] || containerMap.normal;

      const customAccentCss = d.useCustomAccent ? `
        .ed-accent-btn { background-color: ${d.customAccentHex} !important; color: #ffffff !important; border-color: ${d.customAccentHex} !important; }
        .ed-accent-btn:hover { filter: brightness(0.92); }
        .ed-accent-swatch { background-color: ${d.customAccentHex} !important; }
        .ed-accent-text { color: ${d.customAccentHex} !important; }
      ` : '';

      styleEl.textContent = `
        :root {
          --ed-card-radius: ${cardRadius};
          --ed-btn-radius: ${btnRadius};
          --ed-card-shadow: ${cardShadow};
          --ed-container-max: ${containerMax};
        }
        body {
          font-family: ${bodyFont} !important;
        }
        h1, h2, h3 {
          font-family: ${headingFont} !important;
        }
        html:not(.dark) body {
          background-color: ${d.pageBg} !important;
          color: ${d.textColor} !important;
        }
        html:not(.dark) header.ed-site-header {
          background-color: ${d.headerBg} !important;
        }
        html:not(.dark) .ed-surface-card {
          background-color: ${d.cardBg} !important;
        }
        footer.ed-site-footer {
          background-color: ${d.footerBg} !important;
        }
        .ed-container {
          max-width: var(--ed-container-max) !important;
        }
        .ed-surface-card, .ed-photo-card {
          border-radius: var(--ed-card-radius) !important;
          box-shadow: var(--ed-card-shadow) !important;
        }
        .ed-accent-btn {
          border-radius: var(--ed-btn-radius) !important;
        }
        ${customAccentCss}
      `;
    }

    let siteTheme = localStorage.getItem('educraft-theme') || 'light';
    let cartIds = JSON.parse(localStorage.getItem('educraft-cart') || '[]');

    function applySiteTheme(mode) {
      siteTheme = mode;
      localStorage.setItem('educraft-theme', mode);
      document.documentElement.classList.toggle('dark', mode === 'dark');
      if (typeof render === 'function') render();
    }
    document.documentElement.classList.toggle('dark', siteTheme === 'dark');

    function toggleCart(courseId) {
      const idx = cartIds.indexOf(courseId);
      if (idx === -1) {
        cartIds.push(courseId);
        showToast('Курс добавлен в корзину', 'success');
      } else {
        cartIds.splice(idx, 1);
        showToast('Курс удалён из корзины', 'info');
      }
      localStorage.setItem('educraft-cart', JSON.stringify(cartIds));
      render();
    }

    function openSbpPaymentModal(courseId) {
      const course = serverState.courses.find(c => c.id === courseId);
      if (!course) return;

      if (!serverState.currentUser) {
        showToast('Войдите или зарегистрируйтесь для оплаты курса', 'info');
        openAuthModal('login');
        return;
      }

      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4" onclick="closeModal()">
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-md w-full p-6 text-center shadow-2xl relative" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-4 right-4 p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-[#1d1346] text-white text-xs font-extrabold mb-4">
              <span>СБП</span> • Система быстрых платежей
            </div>

            <h3 class="text-base font-bold text-slate-600 dark:text-slate-300 mb-1">${escapeHTML(course.title)}</h3>
            <div class="text-3xl font-extrabold text-slate-900 dark:text-white mb-5">${course.price.toLocaleString('ru-RU')} ₽</div>

            <div class="!bg-white p-4 rounded-2xl border border-slate-200 inline-block mb-4 shadow-xs">
              ${serverState.settings.sbpQrImage
                ? `<img src="${escapeHTML(serverState.settings.sbpQrImage)}" alt="QR-код для оплаты по СБП" class="w-48 h-48 object-contain mx-auto" />`
                : `<svg width="176" height="176" viewBox="0 0 100 100" fill="#0f172a">
                    <rect x="8" y="8" width="26" height="26" fill="none" stroke="#0f172a" stroke-width="5"/>
                    <rect x="15" y="15" width="12" height="12"/>
                    <rect x="66" y="8" width="26" height="26" fill="none" stroke="#0f172a" stroke-width="5"/>
                    <rect x="73" y="15" width="12" height="12"/>
                    <rect x="8" y="66" width="26" height="26" fill="none" stroke="#0f172a" stroke-width="5"/>
                    <rect x="15" y="73" width="12" height="12"/>
                    <rect x="44" y="12" width="12" height="12"/>
                    <rect x="44" y="34" width="12" height="28"/>
                    <rect x="12" y="44" width="22" height="12"/>
                    <rect x="66" y="44" width="26" height="12"/>
                    <rect x="44" y="70" width="14" height="22"/>
                    <rect x="68" y="66" width="24" height="26"/>
                  </svg>`
              }
            </div>

            <p class="text-xs text-slate-500 dark:text-slate-300 leading-relaxed">
              Отсканируйте QR-код камерой смартфона или в мобильном приложении вашего банка для оплаты.
            </p>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    async function completeSbpPurchase(courseId) {
      closeModal();
      await buyCourse(courseId);
      cartIds = cartIds.filter(id => id !== courseId);
      localStorage.setItem('educraft-cart', JSON.stringify(cartIds));
      render();
    }

    async function payAllCartSbp() {
      if (!serverState.currentUser) {
        showToast('Войдите или зарегистрируйтесь для оплаты', 'info');
        openAuthModal('login');
        return;
      }
      const items = serverState.courses.filter(c => cartIds.includes(c.id));
      for (const item of items) {
        await buyCourse(item.id);
      }
      cartIds = [];
      localStorage.setItem('educraft-cart', JSON.stringify(cartIds));
      closeModal();
      render();
    }

    function openCartModal() {
      const items = serverState.courses.filter(c => cartIds.includes(c.id));
      const total = items.reduce((sum, c) => sum + c.price, 0);
      const modal = document.getElementById('modal-container');

      modal.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4" onclick="closeModal()">
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-lg font-extrabold text-slate-900 dark:text-white">Корзина (${items.length})</h3>
              <button onclick="closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            ${items.length === 0 ? `
              <p class="text-sm text-slate-500 dark:text-slate-400 py-8 text-center">В корзине пока нет курсов.</p>
            ` : `
              <div class="space-y-3 max-h-72 overflow-y-auto mb-5">
                ${items.map(c => `
                  <div class="flex items-center justify-between gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                    <div>
                      <div class="text-sm font-bold text-slate-900 dark:text-white">${escapeHTML(c.title)}</div>
                      <div class="text-xs font-semibold text-slate-500 dark:text-slate-400">${c.price.toLocaleString('ru-RU')} ₽</div>
                    </div>
                    <div class="flex items-center gap-2">
                      <button onclick="openSbpPaymentModal('${c.id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white">Оплатить СБП</button>
                      <button onclick="toggleCart('${c.id}'); openCartModal();" class="p-1.5 text-slate-400 hover:text-rose-500">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
              <div class="pt-4 border-t border-slate-200 dark:border-slate-700 flex items-center justify-between gap-4">
                <div>
                  <span class="text-xs font-bold text-slate-500 dark:text-slate-400 block">Итого к оплате:</span>
                  <span class="text-xl font-extrabold text-slate-900 dark:text-white">${total.toLocaleString('ru-RU')} ₽</span>
                </div>
                <button onclick="payAllCartSbp()" class="px-4 py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-indigo-600 via-purple-600 to-rose-600 hover:opacity-95">
                  Оплатить всё по СБП
                </button>
              </div>
            `}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function escapeHTML(str) {
      return String(str ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function showToast(msg, type = 'info') {
      const box = document.getElementById('toast-container');
      const colors = { info: 'bg-slate-900', success: 'bg-emerald-900', warning: 'bg-amber-900', error: 'bg-rose-900' };
      const el = document.createElement('div');
      el.className = `pointer-events-auto text-white text-sm font-medium px-4 py-3 rounded-xl shadow-lg ${colors[type] || colors.info}`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    function closeModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    async function api(url, options = {}) {
      const res = await fetch(url, {
        headers: options.body instanceof FormData ? {} : { 'Content-Type': 'application/json' },
        ...options
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || 'Ошибка запроса к серверу');
      }
      return data;
    }

    async function loadState() {
      serverState = await api('/api/state');
      designDraft = { ...DEFAULT_DESIGN, ...(serverState?.settings?.design || {}) };
      applyPageDesign(designDraft);
      render();
    }

    window.addEventListener('blur', () => {
      if (ui.view === 'lesson' && serverState?.settings?.protection?.blurOnUnfocus) {
        ui.blurred = true;
        render();
      }
    });
    window.addEventListener('focus', () => {
      if (ui.blurred) {
        ui.blurred = false;
        render();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (ui.view === 'lesson' && serverState?.settings?.protection?.blockShortcutsAndCopy) {

    async function loadProtectedHtml(lessonId) {
      try {
        const res = await fetch(`/api/lessons/${lessonId}/html`, { headers: { 'X-Protected-Viewer': '1' } });
        if (!res.ok) throw new Error('Не удалось загрузить HTML-модуль урока');
        activeLessonHtmlContent = await res.text();
        mountLessonHtmlFrame();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function mountLessonHtmlFrame() {
      const frame = document.getElementById('lesson-html-frame');
      if (!frame || !activeLessonHtmlContent) return;
      frame.srcdoc = activeLessonHtmlContent;
      frame.onload = () => {
        try {
          const doc = frame.contentDocument || frame.contentWindow?.document;
          if (doc && doc.body) {
            const h = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight, 520);
            if (!ui.htmlFullscreen) {
              frame.style.height = Math.min(h + 24, 1400) + 'px';
            }
          }
        } catch (e) {}
      };
    }

    async function loadProtectedPdf(lessonId) {
      try {
        const res = await fetch(`/api/lessons/${lessonId}/pdf`, { headers: { 'X-Protected-Viewer': '1' } });
        if (!res.ok) throw new Error('Не удалось загрузить защищённый PDF');
        const buf = await res.arrayBuffer();
        pdfViewer.doc = await pdfjsLib.getDocument({ data: buf }).promise;
        pdfViewer.pageNum = 1;
        await renderPdfPage();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function renderPdfPage() {
      const canvas = document.getElementById('pdf-canvas');
      if (!canvas || !pdfViewer.doc) return;
      const page = await pdfViewer.doc.getPage(pdfViewer.pageNum);
      const viewport = page.getViewport({ scale: pdfViewer.scale });
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      const counter = document.getElementById('pdf-page-info');
      if (counter) counter.textContent = `Страница ${pdfViewer.pageNum} из ${pdfViewer.doc.numPages}`;
    }

    async function changePdfPage(delta) {
      if (!pdfViewer.doc) return;
      const next = pdfViewer.pageNum + delta;
      if (next >= 1 && next <= pdfViewer.doc.numPages) {
        pdfViewer.pageNum = next;
        await renderPdfPage();
      }
    }

    function renderPagePhotosSlot(pageTarget, placement, entityId = '', containerClass = '') {
      const photos = getMatchingPagePhotos(pageTarget, placement, entityId);
      if (!photos.length) return '';

      const widthMap = {
        small: 'max-w-sm',
        medium: 'max-w-2xl',
        large: 'max-w-4xl',
        full: 'max-w-none w-full'
      };
      const alignMap = {
        left: 'mr-auto',
        center: 'mx-auto',
        right: 'ml-auto',
        full: 'w-full'
      };
      const roundMap = {
        none: 'rounded-none',
        md: 'rounded-lg',
        xl: 'rounded-2xl',
        full: 'rounded-full'
      };

      const blocks = photos.map(p => {
        const wCls = p.align === 'full' ? 'max-w-none w-full' : (widthMap[p.widthPreset] || widthMap.medium);
        const aCls = alignMap[p.align] || alignMap.center;
        const rCls = roundMap[p.rounded] || roundMap.xl;
        const fitCls = p.objectFit === 'contain' ? 'object-contain bg-slate-100/60 dark:bg-slate-800/60' : 'object-cover';
        const hStyle = p.heightPx > 0 ? `height:${p.heightPx}px;` : '';
        const imgTag = `<img src="${escapeHTML(p.imageUrl)}" alt="${escapeHTML(p.title || p.caption || 'Фото')}" style="${hStyle}" class="w-full ${p.heightPx > 0 ? '' : 'h-auto'} ${fitCls} ${rCls} block" />`;

        if (p.layoutMode === 'split_left' || p.layoutMode === 'split_right') {
          const isLeft = p.layoutMode === 'split_left';
          return `
            <div class="${wCls} ${aCls} ed-surface-card ed-photo-card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 sm:p-6">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                <div class="${isLeft ? 'md:order-1' : 'md:order-2'}">${imgTag}</div>
                <div class="${isLeft ? 'md:order-2' : 'md:order-1'} space-y-2">
                  ${p.title ? `<h3 class="text-xl font-extrabold text-slate-900 dark:text-white">${escapeHTML(p.title)}</h3>` : ''}
                  ${p.caption ? `<p class="text-sm sm:text-base text-slate-600 dark:text-slate-300 whitespace-pre-line leading-relaxed">${escapeHTML(p.caption)}</p>` : ''}
                </div>
              </div>
            </div>
          `;
        }

        if (p.layoutMode === 'clean') {
          return `
            <figure class="${wCls} ${aCls} space-y-2">
              ${p.title ? `<div class="text-lg font-extrabold text-slate-900 dark:text-white ${p.align === 'center' ? 'text-center' : (p.align === 'right' ? 'text-right' : '')}">${escapeHTML(p.title)}</div>` : ''}
              ${imgTag}
              ${p.caption ? `<figcaption class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 ${p.align === 'center' ? 'text-center' : (p.align === 'right' ? 'text-right' : '')}">${escapeHTML(p.caption)}</figcaption>` : ''}
            </figure>
          `;
        }

        // Default: 'card'
        return `
          <figure class="${wCls} ${aCls} ed-surface-card ed-photo-card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden">
            <div class="p-3 sm:p-4 pb-0">${imgTag}</div>
            ${(p.title || p.caption) ? `
              <figcaption class="p-4 sm:p-5 space-y-1">
                ${p.title ? `<div class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white">${escapeHTML(p.title)}</div>` : ''}
                ${p.caption ? `<p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 whitespace-pre-line leading-relaxed">${escapeHTML(p.caption)}</p>` : ''}
              </figcaption>
            ` : `<div class="h-3 sm:h-4"></div>`}
          </figure>
        `;
      }).join('');

      return `<div class="${containerClass} space-y-6">${blocks}</div>`;
    }

      if (e.currentTarget) e.currentTarget.classList.add('opacity-60', 'ring-2', 'ring-indigo-400');
    }

    function onLessonDragOver(e, courseId) {
      if (draggedLessonState.courseId !== courseId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (e.currentTarget) e.currentTarget.classList.add('border-indigo-500', 'bg-indigo-50/40');
    }

      if (e.currentTarget) e.currentTarget.classList.remove('border-indigo-500', 'bg-indigo-50/40');

    async function onLessonDrop(e, courseId, targetLessonId) {
      e.preventDefault();
      if (e.currentTarget) e.currentTarget.classList.remove('border-indigo-500', 'bg-indigo-50/40');
      const { courseId: srcCourseId, lessonId: srcLessonId } = draggedLessonState;
      draggedLessonState = { courseId: null, lessonId: null };
      if (!srcLessonId || srcCourseId !== courseId || srcLessonId === targetLessonId) return;

      const course = serverState?.courses?.find(c => c.id === courseId);
      if (!course) return;
      const ids = course.lessons.map(l => l.id);
      const fromIdx = ids.indexOf(srcLessonId);
      const toIdx = ids.indexOf(targetLessonId);
      if (fromIdx === -1 || toIdx === -1) return;
      ids.splice(fromIdx, 1);
      ids.splice(toIdx, 0, srcLessonId);
      await persistLessonOrder(courseId, ids);
    }

    function onLessonDragEnd(e) {
      draggedLessonState = { courseId: null, lessonId: null };
      if (e.currentTarget) {
        e.currentTarget.classList.remove('opacity-60', 'ring-2', 'ring-indigo-400', 'border-indigo-500', 'bg-indigo-50/40');
        e.currentTarget.setAttribute('draggable', 'false');
      }
    }

    function parseVideoEmbed(rawUrl) {
      const url = (rawUrl || '').trim();
      if (!url) return null;

      // Прямой видеофайл по ссылке
      if (/\.(mp4|webm|mov|m4v|ogg|ogv)(\?.*)?$/i.test(url)) {
        return { kind: 'direct', src: url, provider: 'Видеопоток' };
      }

      // YouTube
      const ytMatch = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,15})/);
      if (ytMatch) {
        return {
          kind: 'iframe',
          provider: 'YouTube',
          isYoutube: true,
          src: `https://www.youtube.com/embed/${ytMatch[1]}?rel=0&modestbranding=1&iv_load_policy=3`
        };
      }

      // RuTube
      const rtMatch = url.match(/rutube\.ru\/(?:video|play\/embed)\/([a-zA-Z0-9]+)/);
      if (rtMatch) {
        return {
          kind: 'iframe',
          provider: 'RuTube',
          src: `https://rutube.ru/play/embed/${rtMatch[1]}`
        };
      }

      // VK Video / VKVideo
      if (/vk\.com\/video_ext\.php/i.test(url) || /vkvideo\.ru\/video_ext\.php/i.test(url)) {
        return { kind: 'iframe', provider: 'VK Видео', src: url };
      }
      const vkMatch = url.match(/(?:vk\.com|vkvideo\.ru)\/video(-?\d+)_(\d+)/);
      if (vkMatch) {
        return {
          kind: 'iframe',
          provider: 'VK Видео',
          src: `https://vk.com/video_ext.php?oid=${vkMatch[1]}&id=${vkMatch[2]}&hd=2`
        };
      }

      // Vimeo
      const vimeoMatch = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
      if (vimeoMatch) {
        return {
          kind: 'iframe',
          provider: 'Vimeo',
          src: `https://player.vimeo.com/video/${vimeoMatch[1]}?dnt=1&title=0&byline=0&portrait=0`
        };
      }

      // Kinescope
      const kinMatch = url.match(/kinescope\.io\/(?:embed\/)?([a-zA-Z0-9_-]+)/);
      if (kinMatch) {
        return {
          kind: 'iframe',
          provider: 'Kinescope',
          src: `https://kinescope.io/embed/${kinMatch[1]}`
        };
      }

      // Любой другой embed URL (https://...)
      if (/^https?:\/\//i.test(url)) {
        return { kind: 'iframe', provider: 'Видео', src: url };
      }
      return null;
    }

    function formatVideoTime(sec) {
      if (!isFinite(sec) || sec < 0) return '0:00';
      const total = Math.floor(sec);
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      const ss = s < 10 ? '0' + s : '' + s;
      if (h > 0) return `${h}:${m < 10 ? '0' + m : m}:${ss}`;
      return `${m}:${ss}`;
    }

    function initProtectedVideoPlayers() {
      document.querySelectorAll('[data-protected-video]').forEach(wrap => {
        if (wrap.dataset.initialized === '1') return;
        wrap.dataset.initialized = '1';

        const pid = wrap.dataset.protectedVideo;
        const lessonId = wrap.dataset.lessonId || '';
        const video = document.getElementById(`pv-el-${pid}`);
        const shield = document.getElementById(`pv-shield-${pid}`);
        const bigPlay = document.getElementById(`pv-bigplay-${pid}`);
        const playBtn = document.getElementById(`pv-play-${pid}`);
        const seekBar = document.getElementById(`pv-seek-${pid}`);
        const timeEl = document.getElementById(`pv-time-${pid}`);
        const muteBtn = document.getElementById(`pv-mute-${pid}`);
        const volBar = document.getElementById(`pv-vol-${pid}`);
        const speedBtn = document.getElementById(`pv-speed-${pid}`);
        const fsBtn = document.getElementById(`pv-fs-${pid}`);
        if (!video) return;

        const speeds = [1, 1.25, 1.5, 1.75, 2];
        let speedIdx = 0;
        let retriedToken = false;

        function syncPlayUi() {
          const paused = video.paused || video.ended;
          if (bigPlay) bigPlay.style.display = paused ? 'flex' : 'none';
          if (playBtn) playBtn.innerHTML = paused ? '<span>▶</span><span>Старт</span>' : '<span>⏸</span><span>Пауза</span>';
        }

        function togglePlay() {
          if (video.paused || video.ended) {
            video.play().catch(() => {});
          } else {
            video.pause();
          }
        }

        if (shield) shield.addEventListener('click', togglePlay);
        if (playBtn) playBtn.addEventListener('click', togglePlay);

        video.addEventListener('play', syncPlayUi);
        video.addEventListener('pause', syncPlayUi);
        video.addEventListener('ended', syncPlayUi);

        video.addEventListener('loadedmetadata', () => {
          if (timeEl) timeEl.textContent = `${formatVideoTime(video.currentTime)} / ${formatVideoTime(video.duration)}`;
        });

        video.addEventListener('timeupdate', () => {
          if (timeEl) timeEl.textContent = `${formatVideoTime(video.currentTime)} / ${formatVideoTime(video.duration)}`;
          if (seekBar && video.duration > 0) {
            seekBar.value = String(Math.round((video.currentTime / video.duration) * 1000));
          }
        });

        // Авто-обновление токена при истечении сессии просмотра
        video.addEventListener('error', async () => {
          if (!lessonId || retriedToken) return;
          retriedToken = true;
          try {
            const r = await fetch(`/api/lessons/${lessonId}/video-token`, {
              headers: { 'X-Protected-Viewer': '1' }
            });
            if (r.ok) {
              const d = await r.json();
              if (d.videoStreamUrl) {
                const t = video.currentTime || 0;
                video.src = d.videoStreamUrl;
                video.currentTime = t;
              }
            }
          } catch (e) {}
        });

        if (seekBar) {
          seekBar.addEventListener('input', () => {
            if (video.duration > 0) {
              video.currentTime = (Number(seekBar.value) / 1000) * video.duration;
            }
          });
        }

        if (muteBtn) {
          muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            muteBtn.textContent = video.muted || video.volume === 0 ? '🔇' : '🔊';
          });
        }

        if (volBar) {
          volBar.addEventListener('input', () => {
            video.volume = Number(volBar.value);
            video.muted = video.volume === 0;
            if (muteBtn) muteBtn.textContent = video.muted ? '🔇' : '🔊';
          });
        }

        if (speedBtn) {
          speedBtn.addEventListener('click', () => {
            speedIdx = (speedIdx + 1) % speeds.length;
            video.playbackRate = speeds[speedIdx];
            speedBtn.textContent = speeds[speedIdx] + 'x';
          });
        }

        if (fsBtn) {
          fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
              (wrap.requestFullscreen || wrap.webkitRequestFullscreen || (() => {})).call(wrap);
            } else {
              (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
            }
          });
        }

        syncPlayUi();
      });
    }

    function importHtmlFileToSandbox(inputEl) {
      if (!inputEl.files || !inputEl.files[0]) return;
      const file = inputEl.files[0];
      const reader = new FileReader();
      reader.onload = () => {
        codeSandbox.html = String(reader.result || '');
        codeSandbox.activeFile = 'html';
        showToast(`Файл «${file.name}» загружен в редактор`, 'success');
        render();
      };
      reader.readAsText(file, 'UTF-8');
      inputEl.value = '';
    }

    function renderCatalog(theme, onlyPurchased = false) {
      const { settings, courses, currentUser } = serverState;
      const categories = ['Все курсы', ...new Set(courses.map(c => (c.category || '').trim()).filter(Boolean))];

    function buildSandboxDocument() {
      const htmlStr = codeSandbox.html || '';
      if (htmlStr.trim().toLowerCase().startsWith('<!doctype') || htmlStr.trim().toLowerCase().startsWith('<html')) {
        return htmlStr;
      }
      return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${codeSandbox.css}</style></head><body>${htmlStr}<script>${codeSandbox.js}<\/script></body></html>`;
    }

    function openSandboxInNewTab() {
      const win = window.open('', '_blank');
      if (!win) {
        showToast('Разрешите всплывающие окна в браузере, чтобы открыть страницу', 'warning');
        return;
      }
      win.document.open();
      win.document.write(buildSandboxDocument());
      win.document.close();
    }

    function updateCodePreview() {
      const frame = document.getElementById('sandbox-frame');
      if (!frame) return;
      frame.srcdoc = buildSandboxDocument();
    }

                          <label class="flex items-center gap-2 bg-white p-2 rounded-lg border border-slate-200">

                          </label>
                          <label class="flex items-center gap-2 bg-white p-2 rounded-lg border border-slate-200">
                            <input type="color" value="${escapeHTML(d.textColor)}" oninput="updateDesignField('textColor', this.value)" class="w-7 h-7 rounded cursor-pointer border-0 p-0" />

                          </label>
                          <label class="flex items-center gap-2 bg-white p-2 rounded-lg border border-slate-200">
                            <input type="color" value="${escapeHTML(d.headerBg)}" oninput="updateDesignField('headerBg', this.value)" class="w-7 h-7 rounded cursor-pointer border-0 p-0" />
                            <span class="font-semibold text-slate-700">Фон шапки</span>
                          </label>
                          <label class="flex items-center gap-2 bg-white p-2 rounded-lg border border-slate-200">
                            <input type="color" value="${escapeHTML(d.footerBg)}" oninput="updateDesignField('footerBg', this.value)" class="w-7 h-7 rounded cursor-pointer border-0 p-0" />

                            <label class="flex items-center gap-2 font-bold text-slate-700">
                              <input type="checkbox" ${d.useCustomAccent ? 'checked' : ''} onchange="updateDesignField('useCustomAccent', this.checked, true)" />

                            </label>
                            ${d.useCustomAccent ? `
                              <div class="flex items-center gap-2">
                                <input type="color" value="${escapeHTML(d.customAccentHex)}" oninput="updateDesignField('customAccentHex', this.value)" class="w-8 h-8 rounded cursor-pointer border-0 p-0" />
                                <span class="font-mono text-slate-500">${escapeHTML(d.customAccentHex)}</span>
                              </div>

                          </div>

                          <div class="bg-white p-3 rounded-lg border border-slate-200 space-y-2">
                            <label class="flex items-center gap-2 font-bold text-slate-700">
                              <input type="checkbox" ${d.useCustomHeroGradient ? 'checked' : ''} onchange="updateDesignField('useCustomHeroGradient', this.checked, true)" />

                            </label>
                            ${d.useCustomHeroGradient ? `
                              <div class="flex flex-wrap items-center gap-2">

                                <label class="flex items-center gap-1"><input type="color" value="${escapeHTML(d.heroBgEnd)}" oninput="updateDesignField('heroBgEnd', this.value)" class="w-7 h-7 rounded cursor-pointer border-0 p-0" /><span>Цвет 2</span></label>
                                <label class="flex items-center gap-1"><input type="color" value="${escapeHTML(d.heroTextColor)}" oninput="updateDesignField('heroTextColor', this.value)" class="w-7 h-7 rounded cursor-pointer border-0 p-0" /><span>Текст</span></label>

                        </div>

                      <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3">

                          <input value="${escapeHTML(d.logoImage || '')}"
                                 oninput="updateDesignField('logoImage', this.value)"
                                 placeholder="Ссылка на логотип или загрузите файл справа"
                                 class="flex-1 min-w-[200px] px-3 py-1.5 rounded-lg border border-slate-300 text-xs bg-white" />
                          <label class="cursor-pointer px-3 py-1.5 rounded-lg bg-white hover:bg-slate-100 border border-slate-300 text-xs font-bold text-slate-800 inline-flex items-center gap-1.5">
                            <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                            <span>Загрузить логотип</span>

                          </label>
                          ${d.logoImage ? `<button type="button" onclick="updateDesignField('logoImage', '', true)" class="px-2.5 py-1.5 rounded-lg bg-rose-50 text-rose-700 text-xs font-bold">Убрать</button>` : ''}
                        </div>
                        ${d.logoImage ? `
                          <div class="flex items-center gap-4 text-xs">
                            <img src="${escapeHTML(d.logoImage)}" style="height:${d.logoHeight || 36}px" class="w-auto object-contain rounded border border-slate-200 bg-white p-1" />

                              <span>Высота: ${d.logoHeight || 36}px</span>
                              <input type="range" min="24" max="64" value="${d.logoHeight || 36}" oninput="updateDesignField('logoHeight', Number(this.value))" />

                        <span>Живой предпросмотр дизайна</span>
                      </div>

                  </div>

                <!-- БЛОК 2: ДОБАВЛЕНИЕ ФОТО И РАСПОЛОЖЕНИЕ НА СТРАНИЦАХ -->

                      <div class="lg:col-span-8 space-y-3">

                                 placeholder="Вставьте ссылку на фото (https://...) или загрузите файл справа"
                                 class="flex-1 min-w-[220px] px-3.5 py-2 rounded-xl border border-slate-300 text-xs bg-white" />

                            <i data-lucide="upload" class="w-4 h-4"></i>
                            <span>Загрузить фото</span>
                            <input type="file" accept="image/*" class="hidden" onchange="uploadNewPhotoFile(this)" />
                          </label>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <input id="np-title" value="${escapeHTML(newPhotoDraft.title)}"
                                 oninput="newPhotoDraft.title=this.value"
                                 placeholder="Заголовок фото (необязательно)"
                                 class="px-3.5 py-2 rounded-xl border border-slate-300 text-xs bg-white" />
                          <input id="np-caption" value="${escapeHTML(newPhotoDraft.caption)}"
                                 oninput="newPhotoDraft.caption=this.value"
                                 placeholder="Подпись или описание рядом с фото (необязательно)"
                                 class="px-3.5 py-2 rounded-xl border border-slate-300 text-xs bg-white" />
                        </div>

                        <!-- Выбор страницы и привязки -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label class="block text-[11px] font-bold text-slate-600 mb-1">1. На какой странице показать фото</label>
                            <select onchange="updateNewPhotoField('pageTarget', this.value, true)" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs bg-white font-semibold">
                              ${Object.entries(PHOTO_PAGES).map(([k, v]) => `<option value="${k}" ${newPhotoDraft.pageTarget === k ? 'selected' : ''}>${v}</option>`).join('')}
                            </select>
                          </div>

                          ${newPhotoDraft.pageTarget === 'course' ? `
                            <div>
                              <label class="block text-[11px] font-bold text-slate-600 mb-1">Конкретный курс (или на всех)</label>
                              <select onchange="updateNewPhotoField('targetEntityId', this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs bg-white">
                                <option value="">На страницах всех курсов</option>
                                ${courses.map(c => `<option value="${c.id}" ${newPhotoDraft.targetEntityId === c.id ? 'selected' : ''}>${escapeHTML(c.title)}</option>`).join('')}
                              </select>
                            </div>
                          ` : ''}

                          ${newPhotoDraft.pageTarget === 'lesson' ? `
                            <div>
                              <label class="block text-[11px] font-bold text-slate-600 mb-1">Конкретный урок (или во всех)</label>
                              <select onchange="updateNewPhotoField('targetEntityId', this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs bg-white">
                                <option value="">На страницах всех уроков</option>
                                ${allLessonsFlat.map(item => `<option value="${item.id}" ${newPhotoDraft.targetEntityId === item.id ? 'selected' : ''}>${escapeHTML(item.label)}</option>`).join('')}
                              </select>
                            </div>
                          ` : ''}
                        </div>

                        <!-- Интерактивный выбор места расположения на странице -->

                          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                            ${npPlacements.map(pk => `
                              <button type="button" onclick="updateNewPhotoField('placement', '${pk}', true)"
                                      class="px-3 py-2 rounded-xl border text-xs font-bold text-left transition ${newPhotoDraft.placement === pk ? 'bg-indigo-600 text-white border-indigo-600 shadow-xs' : 'bg-white text-slate-700 border-slate-300 hover:border-indigo-400'}">
                                ${PHOTO_PLACEMENTS[pk]}
                              </button>
                            `).join('')}
                          </div>
                        </div>

                        <!-- Горизонтальное выравнивание и параметры отображения -->
                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2.5">
                          <div>
                            <label class="block text-[11px] font-bold text-slate-600 mb-1">Положение</label>
                            <select onchange="updateNewPhotoField('align', this.value)" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs bg-white">
                              ${Object.entries(PHOTO_ALIGNS).map(([k, v]) => `<option value="${k}" ${newPhotoDraft.align === k ? 'selected' : ''}>${v}</option>`).join('')}

                          </div>
                          <div>
                            <label class="block text-[11px] font-bold text-slate-600 mb-1">Размер (ширина)</label>

                          <div>
                            <label class="block text-[11px] font-bold text-slate-600 mb-1">Высота</label>

                              <option value="320" ${Number(newPhotoDraft.heightPx) === 320 ? 'selected' : ''}>320 px</option>
                              <option value="420" ${Number(newPhotoDraft.heightPx) === 420 ? 'selected' : ''}>420 px</option>
                              <option value="540" ${Number(newPhotoDraft.heightPx) === 540 ? 'selected' : ''}>540 px</option>
                            </select>
                          </div>
                          <div>
                            <label class="block text-[11px] font-bold text-slate-600 mb-1">Формат блока</label>
                            <select onchange="updateNewPhotoField('layoutMode', this.value)" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs bg-white">
                              ${Object.entries(PHOTO_LAYOUTS).map(([k, v]) => `<option value="${k}" ${newPhotoDraft.layoutMode === k ? 'selected' : ''}>${v}</option>`).join('')}
                            </select>
                          </div>
                          <div>
                            <label class="block text-[11px] font-bold text-slate-600 mb-1">Углы / масштаб</label>
                            <select onchange="updateNewPhotoField('rounded', this.value)" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs bg-white">
                              <option value="none" ${newPhotoDraft.rounded === 'none' ? 'selected' : ''}>Прямые углы</option>
                              <option value="md" ${newPhotoDraft.rounded === 'md' ? 'selected' : ''}>Лёгкое скругление</option>
                              <option value="xl" ${newPhotoDraft.rounded === 'xl' ? 'selected' : ''}>Скруглённое</option>
                              <option value="full" ${newPhotoDraft.rounded === 'full' ? 'selected' : ''}>Овал / Круг</option>
                            </select>
                          </div>
                        </div>
                      </div>

                      <!-- Предпросмотр загружаемого фото -->
                      <div class="lg:col-span-4 space-y-3">
                        <div class="h-44 rounded-xl border-2 border-dashed border-slate-300 bg-white flex items-center justify-center overflow-hidden p-2">
                          ${newPhotoDraft.imageUrl
                            ? `<img src="${escapeHTML(newPhotoDraft.imageUrl)}" alt="Предпросмотр" class="max-h-full max-w-full object-contain rounded-lg" />`
                            : `<div class="text-center text-xs text-slate-400 px-4"><i data-lucide="image" class="w-8 h-8 mx-auto mb-1.5 opacity-50"></i><div>Здесь появится предпросмотр выбранного фото</div></div>`
                          }
                        </div>
                        <button type="submit" class="w-full py-2.5 rounded-xl text-xs font-bold ${theme.btn} inline-flex items-center justify-center gap-1.5">
                          <i data-lucide="plus-circle" class="w-4 h-4"></i>
                          <span>Добавить фото на страницу</span>
                        </button>
                      </div>
                    </div>
                  </form>

                  <!-- Список размещённых фото -->
                  <div class="space-y-4">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                      <div class="text-xs font-extrabold text-slate-700 uppercase">Размещённые фотографии (${photos.length})</div>
                      <div class="flex flex-wrap gap-1.5 text-xs">
                        ${[
                          ['all', 'Все'],
                          ['catalog', 'Главная'],
                          ['course', 'Курсы'],
                          ['lesson', 'Уроки'],
                          ['my-courses', 'Моё обучение']
                        ].map(([k, label]) => `
                          <button type="button" onclick="ui.photoFilterPage='${k}';render()"
                                  class="px-3 py-1 rounded-lg font-bold border ${ui.photoFilterPage === k ? theme.btn + ' border-transparent' : 'bg-white border-slate-200 text-slate-600'}">
                            ${label}
                          </button>
                        `).join('')}
                      </div>
                    </div>

                    ${filteredPhotos.length === 0 ? `
                      <div class="p-8 rounded-xl border border-dashed border-slate-300 text-center text-xs text-slate-500">
                        В выбранной категории пока нет добавленных фотографий. Загрузите фото в форме выше.
                      </div>
                    ` : `
                      <div class="space-y-4">
                        ${filteredPhotos.map((p, idx) => {
                          const pPlacements = getPlacementOptions(p.pageTarget);
                          return `
                            <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 ${p.isVisible ? '' : 'opacity-65'} space-y-3">
                              <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-slate-200/80">
                                <div class="flex flex-wrap items-center gap-2 text-xs">
                                  <span class="px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-800 font-extrabold">#${idx + 1}</span>
                                  <span class="px-2 py-0.5 rounded-md bg-white border border-slate-200 font-bold text-slate-700">${escapeHTML(PHOTO_PAGES[p.pageTarget] || p.pageTarget)}</span>
                                  <span class="px-2 py-0.5 rounded-md bg-emerald-50 border border-emerald-200 font-bold text-emerald-700">${escapeHTML(PHOTO_PLACEMENTS[p.placement] || p.placement)}</span>
                                  ${!p.isVisible ? '<span class="px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 font-bold">Скрыто</span>' : ''}
                                </div>
                                <div class="flex items-center gap-1.5">
                                  <button type="button" onclick="movePagePhotoOrder('${p.id}', -1)" ${idx === 0 ? 'disabled' : ''} class="px-2 py-1 rounded-lg bg-white border border-slate-300 text-xs font-bold disabled:opacity-40" title="Выше">↑</button>
                                  <button type="button" onclick="movePagePhotoOrder('${p.id}', 1)" ${idx === filteredPhotos.length - 1 ? 'disabled' : ''} class="px-2 py-1 rounded-lg bg-white border border-slate-300 text-xs font-bold disabled:opacity-40" title="Ниже">↓</button>
                                  <button type="button" onclick="togglePagePhotoVisibility('${p.id}', ${!p.isVisible})" class="px-2.5 py-1 rounded-lg bg-white border border-slate-300 text-xs font-bold text-slate-700 hover:bg-slate-100">
                                    ${p.isVisible ? 'Скрыть' : 'Показать'}
                                  </button>
                                </div>
                              </div>

                              <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
                                <div class="lg:col-span-3 space-y-2">
                                  <div class="h-32 rounded-xl overflow-hidden bg-white border border-slate-200 flex items-center justify-center">
                                    <img src="${escapeHTML(p.imageUrl)}" alt="${escapeHTML(p.title || 'Фото')}" class="w-full h-full object-cover" />
                                  </div>
                                  <label class="cursor-pointer w-full py-1.5 px-2.5 rounded-lg bg-white hover:bg-slate-100 border border-slate-300 text-[11px] font-bold text-slate-700 flex items-center justify-center gap-1.5">
                                    <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                                    <span>Заменить фото</span>
                                    <input type="file" accept="image/*" class="hidden" onchange="replacePagePhotoImage('${p.id}', this)" />

                    </div>
                    <div>
                      <label class="block text-xs font-bold text-slate-600 mb-1">PIN-код (необязательно)</label>
                      <input id="nc-pin" placeholder="Без пароля" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
                    </div>
                  </div>

                  <div id="nc-sfu-wrap" class="hidden">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Адрес SFU-сервера Jitsi (можно указать свой сервер)</label>
                    <input id="nc-sfu" value="meet.ffmuc.net" placeholder="meet.ffmuc.net или ваш домен Jitsi" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
                  </div>

                  <div class="flex flex-wrap items-center justify-between gap-4 pt-2">
                    <div class="flex flex-wrap gap-5 text-xs font-semibold text-slate-700">
                      <label class="flex items-center gap-2"><input type="checkbox" id="nc-rec" checked /> Разрешить запись видеозвонков</label>
                      <label class="flex items-center gap-2"><input type="checkbox" id="nc-mute" checked /> Выключать микрофоны учеников при входе</label>
                    </div>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-bold ${theme.btn} inline-flex items-center gap-1.5">
                      <i data-lucide="plus-circle" class="w-4 h-4"></i>
                      <span>Создать видеоконференцию</span>
                    </button>
                  </div>
                </form>

                <!-- Список созданных видеоконференций и их записей -->
                <div class="space-y-4">
                  <div class="text-xs font-extrabold text-slate-500 uppercase">Созданные комнаты (${confs.length})</div>
                  ${confs.length === 0 ? `
                    <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-10 text-center text-xs text-slate-500">
                      Видеоконференций пока нет. Создайте первую комнату в форме выше.
                    </div>
                  ` : confs.map(cf => `
                    <div class="bg-white rounded-2xl border border-slate-200 p-6 space-y-4">
                      <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-100">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="px-2.5 py-1 rounded-full text-xs font-extrabold ${cf.status === 'live' ? 'bg-rose-100 text-rose-700' : (cf.status === 'ended' ? 'bg-slate-100 text-slate-600' : 'bg-indigo-50 text-indigo-700')}">
                            ${cf.status === 'live' ? '● В эфире' : (cf.status === 'ended' ? 'Завершена' : 'Запланирована')}
                          </span>
                          <span class="text-xs font-semibold text-slate-500">Онлайн: ${cf.onlineCount} / ${cf.maxParticipants}</span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                          <button type="button" onclick="openConferenceRoom('${cf.id}')" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold inline-flex items-center gap-1.5">
                            <i data-lucide="video" class="w-3.5 h-3.5"></i>
                            <span>Войти как организатор</span>
                          </button>
                          <button type="button" onclick="copyConferenceLink('${cf.id}')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold">
                            Копировать ссылку
                          </button>
                          ${cf.status !== 'live'
                            ? `<button type="button" onclick="setConferenceStatus('${cf.id}', 'live')" class="px-3 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold">Запустить эфир</button>`
                            : `<button type="button" onclick="setConferenceStatus('${cf.id}', 'ended')" class="px-3 py-1.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-bold">Завершить</button>`
                          }
                        </div>
                      </div>

                      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                        <input id="cf-title-${cf.id}" value="${escapeHTML(cf.title)}" class="md:col-span-2 px-3 py-2 rounded-xl border border-slate-300 font-bold" />
                        <select id="cf-status-${cf.id}" class="px-3 py-2 rounded-xl border border-slate-300 font-semibold">
                          <option value="scheduled" ${cf.status === 'scheduled' ? 'selected' : ''}>Статус: Запланирована</option>
                          <option value="live" ${cf.status === 'live' ? 'selected' : ''}>Статус: В эфире</option>
                          <option value="ended" ${cf.status === 'ended' ? 'selected' : ''}>Статус: Завершена</option>
                        </select>
                        <select id="cf-course-${cf.id}" class="px-3 py-2 rounded-xl border border-slate-300">
                          <option value="">Все авторизованные ученики</option>
                          ${courses.map(c => `<option value="${c.id}" ${cf.courseId === c.id ? 'selected' : ''}>Курс: ${escapeHTML(c.title)}</option>`).join('')}
                        </select>
                        <input id="cf-date-${cf.id}" value="${escapeHTML(cf.scheduledAt)}" placeholder="Дата и время" class="px-3 py-2 rounded-xl border border-slate-300" />
                        <select id="cf-max-${cf.id}" class="px-3 py-2 rounded-xl border border-slate-300">
                          ${[30, 50, 100, 300].map(m => `<option value="${m}" ${Number(cf.maxParticipants) === m ? 'selected' : ''}>Лимит: до ${m} уч.</option>`).join('')}
                        </select>
                        <select id="cf-engine-${cf.id}" class="px-3 py-2 rounded-xl border border-slate-300">
                          <option value="builtin" ${cf.engine === 'builtin' ? 'selected' : ''}>Встроенный Zoom-зал (30+)</option>
                          <option value="jitsi" ${cf.engine === 'jitsi' ? 'selected' : ''}>SFU-сервер Jitsi (30–300+)</option>
                        </select>
                        <input id="cf-sfu-${cf.id}" value="${escapeHTML(cf.sfuDomain)}" placeholder="Домен SFU (meet.ffmuc.net)" class="px-3 py-2 rounded-xl border border-slate-300" />
                        <input id="cf-pin-${cf.id}" value="${escapeHTML(cf.accessPin || '')}" placeholder="PIN-код (необязательно)" class="px-3 py-2 rounded-xl border border-slate-300" />
                      </div>

                      <textarea id="cf-desc-${cf.id}" rows="2" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" placeholder="Описание встречи...">${escapeHTML(cf.description)}</textarea>

                      <div class="flex flex-wrap items-center justify-between gap-3">
                        <div class="flex flex-wrap gap-4 text-xs font-semibold text-slate-700">
                          <label class="flex items-center gap-1.5"><input type="checkbox" id="cf-rec-${cf.id}" ${cf.allowRecording ? 'checked' : ''} /> Запись звонков</label>
                          <label class="flex items-center gap-1.5"><input type="checkbox" id="cf-mute-${cf.id}" ${cf.muteOnEntry ? 'checked' : ''} /> Тишина при входе</label>
                        </div>
                        <div class="flex gap-2">
                          <button type="button" onclick="saveAdminConference('${cf.id}')" class="px-4 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold">Сохранить</button>
                          <button type="button" onclick="deleteAdminConference('${cf.id}')" class="px-4 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold">Удалить</button>
                        </div>
                      </div>

                      <!-- Сохранённые записи этой видеоконференции -->
                      <div class="pt-3 border-t border-slate-100 space-y-2.5">
                        <div class="text-xs font-bold text-slate-600 flex items-center gap-1.5">
                          <i data-lucide="film" class="w-3.5 h-3.5 text-violet-600"></i>
                          <span>Записи звонков этой комнаты (${(cf.recordings || []).length})</span>
                        </div>
                        ${(cf.recordings || []).length === 0 ? `
                          <div class="text-xs text-slate-400">Записей пока нет — нажмите «Запись» внутри комнаты во время звонка.</div>
                        ` : `
                          <div class="space-y-2">
                            ${(cf.recordings || []).map(r => `
                              <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex flex-wrap items-center justify-between gap-3 text-xs">
                                <div>
                                  <div class="font-bold text-slate-900">${escapeHTML(r.title)}</div>
                                  <div class="text-[11px] text-slate-500">${formatVideoTime(r.durationSec)} • ${(r.fileSize / (1024 * 1024)).toFixed(1)} МБ • ${escapeHTML(r.createdAt)} • Записал: ${escapeHTML(r.recordedBy)}</div>
                                </div>
                                <div class="flex flex-wrap items-center gap-2">
                                  <button type="button" onclick="openRecordingPlayerModal('${r.id}', '${escapeHTML(r.title).replace(/'/g, '')}', '${escapeHTML(r.streamUrl)}')" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-bold">
                                    ▶ Смотреть
                                  </button>
                                  ${allLessonsFlat.length ? `
                                    <select id="rec-lesson-${r.id}" class="px-2 py-1.5 rounded-lg border border-slate-300 bg-white text-xs max-w-[200px]">
                                      <option value="">Прикрепить к уроку...</option>
                                      ${allLessonsFlat.map(item => `<option value="${item.id}">${escapeHTML(item.label)}</option>`).join('')}
                                    </select>
                                    <button type="button" onclick="attachRecordingToLesson('${r.id}')" class="px-2.5 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-800 font-bold">
                                      В урок
                                    </button>
                                  ` : ''}
                                  <button type="button" onclick="deleteConferenceRecording('${r.id}')" class="px-2.5 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold">
                                    Удалить
                                  </button>
                                </div>
                              </div>
                            `).join('')}
                          </div>
                        `}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          })() : ''}

          ${ui.constructorTab === 'clients' ? `
            <div class="space-y-6">
              <!-- Форма ручного добавления ученика / пользователя -->
              <form onsubmit="createAdminUser(event)" class="bg-white rounded-2xl border border-slate-200 p-6 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
                  <div>
                    <h2 class="text-base font-extrabold text-slate-900 flex items-center gap-2">
                      <i data-lucide="user-plus" class="w-4 h-4 text-indigo-600"></i>
                      <span>Добавить ученика вручную</span>
                    </h2>
                    <p class="text-xs text-slate-500 mt-0.5">Создайте аккаунт, задайте роль и при необходимости сразу откройте доступ к курсам</p>
                  </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                  <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Имя и фамилия *</label>
                    <input id="new-user-name" type="text" required placeholder="Например: Анна Петрова"
                           class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Email *</label>
                    <input id="new-user-email" type="email" required placeholder="user@example.com"
                           class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Пароль *</label>
                    <input id="new-user-pass" type="text" required minlength="3" placeholder="Минимум 3 символа"
                           class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Роль</label>
                    <select id="new-user-role" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm font-semibold">
                      <option value="student" selected>Ученик</option>
                      <option value="admin">Администратор</option>
                    </select>
                  </div>
                </div>

                ${courses.length ? `
                  <div class="space-y-1.5">
                    <div class="text-xs font-bold text-slate-600">Открыть доступ к курсам сразу при добавлении:</div>
                    <div class="flex flex-wrap gap-2">
                      ${courses.map(c => `
                        <label class="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-50 border border-slate-200 hover:border-indigo-300 text-xs font-semibold text-slate-700 cursor-pointer">
                          <input type="checkbox" value="${c.id}" class="new-user-course-chk rounded" />
                          <span>${escapeHTML(c.title.length > 42 ? c.title.slice(0, 42) + '…' : c.title)}</span>
                        </label>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}

                <div class="flex justify-end">
                  <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-bold ${theme.btn} inline-flex items-center gap-1.5">
                    <i data-lucide="user-plus" class="w-4 h-4"></i>
                    <span>Добавить пользователя</span>
                  </button>
                </div>
              </form>

              <!-- Таблица пользователей с управлением ролями и доступами -->
              <div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
                <table class="w-full text-left text-sm">
                  <thead class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500">
                    <tr>
                      <th class="p-4">Пользователь</th>
                      <th class="p-4">Роль</th>
                      <th class="p-4">Доступы к курсам</th>
                      <th class="p-4 text-right">Действия</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${users.map(u => {
                      const isSelf = serverState.currentUser && serverState.currentUser.id === u.id;
                      const isAdminRole = u.role === 'admin';
                      return `
                        <tr>
                          <td class="p-4">
                            <div class="font-bold text-slate-900 flex items-center gap-1.5">
                              <span>${escapeHTML(u.name)}</span>
                              ${isSelf ? '<span class="px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700 text-[10px] font-bold">Вы</span>' : ''}
                            </div>
                            <div class="text-xs text-slate-500">${escapeHTML(u.email)}</div>
                            ${u.createdAt ? `<div class="text-[11px] text-slate-400 mt-0.5">Добавлен: ${escapeHTML(u.createdAt)}</div>` : ''}
                          </td>
                          <td class="p-4">
                            <select onchange="changeUserRole('${u.id}', this.value)"
                                    ${isSelf ? 'disabled title="Нельзя изменить роль текущего аккаунта"' : ''}
                                    class="px-2.5 py-1.5 rounded-lg border text-xs font-bold ${isAdminRole ? 'bg-amber-50 border-amber-200 text-amber-800' : 'bg-slate-50 border-slate-300 text-slate-700'} disabled:opacity-60 disabled:cursor-not-allowed">
                              <option value="student" ${u.role === 'student' ? 'selected' : ''}>Ученик</option>
                              <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Администратор</option>
                            </select>
                          </td>
                          <td class="p-4">
                            <div class="flex flex-wrap gap-2">
                              ${courses.map(c => {
                                const has = u.purchasedCourseIds.includes(c.id);
                                return `
                                  <button onclick="toggleUserCourseAccess('${u.id}', '${c.id}', ${!has})"
                                          class="px-2.5 py-1 rounded-lg text-xs font-semibold border ${has ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-slate-50 border-slate-200 text-slate-500'}">
                                    ${has ? '✓ ' : '+ '}${escapeHTML(c.title.slice(0, 28))}...
                                  </button>
                                `;
                              }).join('')}
                            </div>
                          </td>
                          <td class="p-4 text-right whitespace-nowrap">
                            <div class="inline-flex items-center gap-1.5">
                              <button type="button"
                                      onclick="openEditUserModal('${u.id}')"
                                      class="px-2.5 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold inline-flex items-center gap-1">
                                <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                                <span>Редактировать</span>
                              </button>
                              ${isSelf ? '' : `
                                <button type="button"
                                        onclick="deleteAdminUser('${u.id}')"
                                        class="px-2.5 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold">
                                  Удалить
                                </button>
                              `}
                            </div>
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    loadState();
  </script>
</body>
</html>
